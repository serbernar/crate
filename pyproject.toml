[project]
name = "crate"
version = "0.1.0"
description = "CLI for sorting Spotify Liked Songs into playlists"
requires-python = ">=3.11"
dependencies = [
    "spotipy>=2.24",
    "questionary>=2.0",
]

[project.scripts]
crate = "crate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crate*"]
